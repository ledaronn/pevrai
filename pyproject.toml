[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pevrai"
version = "0.1.2"
description = "A local, permission-gated personal agent: file system, browser and MCP tools behind a single supervised loop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["agent", "llm", "mcp", "permission-gate", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]
# Cekirdek: model istemcisi, MCP koprusu, pencere. Belge okuyuculari ve
# tarayici ekstra: hepsi kurulmadan da calisir (belge.py ImportError'u metne
# cevirir, tarayici paketi Araclar panelinden kaldirilabilir).
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "mcp[cli]>=1.0.0",
    "pywebview>=6.0",
]

[project.optional-dependencies]
belge = ["pymupdf>=1.24.0", "python-docx>=1.1.0", "python-pptx>=0.6.23", "openpyxl>=3.1.0"]
tarayici = ["playwright>=1.40.0"]
# Windows yerlesik OCR (Windows.Media.Ocr): ekran goruntusu, fotograf, taranmis PDF.
# Model indirmez; dil paketleri Windows'tan gelir. Windows disinda kurulmaz/calismaz.
ocr = ["winrt-runtime>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",
       "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
       "Pillow>=10.0.0", "pymupdf>=1.24.0"]
donusturucu = ["pymupdf>=1.24.0", "python-pptx>=0.6.23", "Pillow>=10.0.0"]
donusturucu-gui = ["customtkinter>=5.2.0", "tkinterdnd2>=0.3.0", "Pillow>=10.0.0"]
anthropic = ["anthropic>=0.40"]          # Anthropic Claude saglayicisi (pevrai/model/anthropic_.py)
anahtar = ["keyring>=25"]                 # API anahtarini sistem deposunda sakla (yoksa ~/.vekil/credentials.json)
dev = ["pyyaml>=6.0", "playwright>=1.40.0", "Pillow>=10.0.0"]
# Hepsi birden (requirements.txt ile ayni kume, GUI haric)
tam = ["pevrai[belge,tarayici,ocr,donusturucu,anthropic,anahtar,dev]"]

[project.scripts]
pevrai = "pevrai.baslat:main"
pevrai-cli = "pevrai.vekil_v0:main"

[project.urls]
Documentation = "https://github.com/ledaronn/pevrai/tree/main/docs"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pevrai*"]

[tool.setuptools.package-data]
pevrai = ["arayuz/*.html", "arayuz/*.ico", "arayuz/*.js", "arayuz/*.css", "arayuz/eklentiler/*/*.js",
          "arayuz/ofis/*.js", "arayuz/vendor/*.js", "arayuz/vendor/THREE_LICENSE"]
