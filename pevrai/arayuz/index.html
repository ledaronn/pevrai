<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<title>Pevrai</title>

<link rel="stylesheet" href="stil.css">


<link rel="stylesheet" href="eklentiler.css">

</head>

<body>



<nav id="ray" aria-label="Ana gezinme">

  <button class="ray-dugme" id="ray-yan" title="Kenar çubuğu" aria-label="Kenar çubuğu"></button>

  <button class="ray-dugme" id="ray-yeni" title="Yeni sohbet (Ctrl+N)" aria-label="Yeni sohbet (Ctrl+N)"></button>

  <button class="ray-dugme" id="ray-ara" title="Sohbetlerde ara (Ctrl+K)" aria-label="Sohbetlerde ara (Ctrl+K)"></button>

  <button class="ray-dugme" id="ray-araclar" title="Araçlar" aria-label="Araçlar"></button>

  <button class="ray-dugme" id="ray-eklentiler" title="Çalışma alanın (Study, Notes, Workspace)" aria-label="Çalışma alanı (Study, Notes, Workspace)"></button>

  <button class="ray-dugme" id="ray-ekip" title="Ekip (çoklu ajan)" aria-label="Ekip (çoklu ajan)"></button>

  <button class="ray-dugme" id="ray-ag" title="Düşünce Ağı (baloncuklar)" aria-label="Düşünce Ağı (baloncuklar)"></button>

  <span class="ray-bosluk"></span>

  <button class="ray-dugme" id="ray-degisiklik" title="Değişiklikler (geçmiş ve geri alma)" aria-label="Değişiklikler (geçmiş ve geri alma)"></button>

  <button class="ray-dugme" id="ray-ayarlar" title="Ayarlar" aria-label="Ayarlar"></button>

</nav>



<aside id="yan">

  <div class="ust">

    <div class="marka" id="marka" title="Yeni sohbet">

      <span id="marka-logo" style="width:28px;height:21px"></span>

      <span class="ad">Pevrai</span>

    </div>

    <button class="yan-eylem" id="yan-yeni">

      <span class="im"></span><span>Yeni sohbet</span><span class="kisayol">Ctrl N</span>

    </button>

    <div id="arama-kutu">

      <span class="im" id="arama-im"></span>

      <input id="arama" type="text" placeholder="Sohbetlerde ara" autocomplete="off">

    </div>

  </div>

  <div class="baslik">SOHBETLER</div>

  <div class="liste" id="sohbet-listesi"></div>

  <div class="dip">

    <button class="yan-eylem" id="yan-ayarlar">

      <span class="im"></span><span>Ayarlar</span>

    </button>

  </div>

</aside>



<main id="ana">

  <div id="eklentiler-gorunum"></div>

  <div id="ekip-gorunum"></div>

  <div id="ag-gorunum"></div>

  <div id="akis"><div id="kolon" role="log" aria-live="polite" aria-relevant="additions text"></div></div>



  <div id="araclar-gorunum"><div class="kolon">

    <h2>Araçlar</h2>

    <div class="alt">Ajanın araçları paketler halinde. Aracı kapatmak yalnızca bu sohbeti etkiler; paketi kaldırmak kalıcıdır ve geri alınabilir. MCP sunucularının araçları sınıflandırılana kadar gizli kalır.</div>

    <div id="arac-liste"></div>

  </div></div>



  <div id="sabit"><div class="kolon" id="sabit-kolon"></div></div>



  <div id="dip"><div class="kolon">

    <div id="ekler"></div>

    <div id="kutu">

      <textarea id="girdi" rows="1" placeholder="Bir görev veya soru yaz..."></textarea>

      <div class="kutu-alt">

        <button class="yuvarlak" id="arti" title="Ekle ve araçlar" aria-label="Ekle ve araçlar"></button>

        <span class="bosluk"></span>

        <button id="sohbet-anahtar" title="Sohbet modu: araç yok, sadece konuşma" aria-label="Sohbet modu: araç yok, sadece konuşma"><span class="im"></span><span id="sohbet-ad">Görev</span></button>

        <button id="model-sec" aria-label="Model seç"><span class="im"></span><span id="model-ad">Otomatik</span></button>

        <button id="mod" aria-label="Çalışma modu seç"><span class="im"></span><span id="mod-ad">Dengeli</span></button>

        <button class="yuvarlak" id="ses-btn" type="button" hidden title="Sesli giriş" aria-label="Sesli giriş"></button>

        <button id="gonder" class="pasif" title="Gönder" aria-label="Gönder"></button>

      </div>

    </div>

    <div class="ipucu"><span>Shift + Enter ile yeni satır</span><span class="nokta">·</span><button id="kisayol-ipucu-btn" class="metin-btn" type="button" title="Klavye kısayolları (?)">? Kısayollar</button><span class="nokta" id="sayac-nokta" hidden>·</span><span id="canli-sayac" class="canli-sayac" hidden></span></div>



    <div class="menu" id="menu-arti"></div>

    <div class="menu" id="menu-mod"></div>

    <div class="menu" id="menu-model"></div>

    <div class="menu" id="menu-slash"></div>

  </div></div>

</main>



<dialog id="kare-perde" aria-labelledby="kare-baslik" aria-describedby="kare-konum">

  <div class="kare-pencere-bas">

    <div class="kare-pencere-metin"><div id="kare-baslik"></div><div id="kare-konum"></div></div>

    <button id="kare-kapat" type="button" autofocus aria-label="Kapat" title="Kapat"></button>

  </div>

  <div class="kare-pencere-ic"><img id="kare-buyuk" alt="Tarayıcı görüntüsü, büyütülmüş"></div>

</dialog>



<div id="perde"></div>

<div class="menu" id="menu-sohbet"></div>

<div id="kisayol-perde"><div id="kisayol" role="dialog" aria-modal="true" aria-label="Klavye kısayolları">
  <div class="ust">
    <span class="bas">Klavye kısayolları</span>
    <button class="kucuk" id="kisayol-kapat" aria-label="Kapat">&#215;</button>
  </div>
  <div id="kisayol-liste"></div>
</div></div>

<div id="ayar-perde"><div id="ayar" role="dialog" aria-label="Ayarlar">

  <div class="ust">

    <span class="bas">Ayarlar</span>

    <span class="kaydedildi" id="ayar-kaydedildi">Kaydedildi</span>

    <button class="kucuk" id="ayar-kapat" aria-label="Kapat">&#215;</button>

  </div>

  <div class="govde">

    <nav id="ayar-menu"></nav>

    <div id="ayar-ic"></div>

  </div>

</div></div>



<div id="kurulum-perde"><div id="kurulum" role="dialog" aria-modal="true" aria-labelledby="kurulum-baslik">

  <div class="k-ust"><div class="k-adimlar" id="kurulum-adimlar"></div>

    <h2 id="kurulum-baslik"></h2><p class="k-alt" id="kurulum-alt"></p></div>

  <div class="k-govde" id="kurulum-govde"></div>

  <div class="k-dip" id="kurulum-dip"></div>

</div></div>



<div id="toastlar"></div>

<script src="app.js"></script>


<script src="eklentiler.js"></script>

<script src="ekip.js"></script>

<script src="ofis/durum.js"></script>

<script src="ofis/sahne.js"></script>

<script src="ofis/ofis.js"></script>

<script src="ag.js"></script>

<script src="eklentiler/overview/ui.js"></script>

<script src="eklentiler/study/ui.js"></script>

<script src="eklentiler/notes/ui.js"></script>

<script src="eklentiler/workspace/ui.js"></script>

</body>

</html>
